name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "dev-*" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline, ldap, msgpack, igbinary, redis, sodium
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Configure Composer security policy
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Execute lint
        run: composer run lint

      - name: Execute static analysis
        run: composer run stan

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Composer audit
        run: composer audit

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  tests:
    needs: [lint, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: [10, 11, 12, 13]
        redis: [6, 7, 8]
        exclude:
          - php: 8.5
            laravel: 10
          - php: 8.5
            laravel: 11
          - php: 8.2
            laravel: 13

    name: PHP ${{ matrix.php }} - L${{ matrix.laravel }} - R${{ matrix.redis }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline, ldap, msgpack, igbinary, redis, sodium
          tools: composer:v2
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Calculate unique ports for this matrix job
        id: ports
        run: |
          # Calculate unique port base for this specific matrix combination
          # Base: 7000 + (index * 10) where index is calculated from matrix values
          # This ensures each job gets 5 consecutive ports (main, replica1, replica2, standalone, sentinel)

          PHP_INDEX=$(echo "${{ matrix.php }}" | sed 's/8\.//' | sed 's/\.//g')  # 8.2->2, 8.3->3, 8.4->4, 8.5->5
          LARAVEL_INDEX=${{ matrix.laravel }}  # 10, 11, 12
          REDIS_INDEX=${{ matrix.redis }}  # 6, 7

          # Calculate unique index: ((PHP-2)*8 + (LARAVEL-10)*2 + (REDIS-6))
          MATRIX_INDEX=$(( (PHP_INDEX - 2) * 8 + (LARAVEL_INDEX - 10) * 2 + (REDIS_INDEX - 6) ))
          PORT_BASE=$((7000 + MATRIX_INDEX * 10))

          echo "Matrix combination: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Redis ${{ matrix.redis }}"
          echo "Matrix index: ${MATRIX_INDEX}, Port base: ${PORT_BASE}"

          echo "redis_main=$((PORT_BASE + 0))" >> $GITHUB_OUTPUT
          echo "redis_replica1=$((PORT_BASE + 1))" >> $GITHUB_OUTPUT
          echo "redis_replica2=$((PORT_BASE + 2))" >> $GITHUB_OUTPUT
          echo "redis_standalone=$((PORT_BASE + 3))" >> $GITHUB_OUTPUT
          echo "sentinel=$((PORT_BASE + 4))" >> $GITHUB_OUTPUT

          # Docker Compose project name must be lowercase alphanumeric, hyphens, underscores only
          PROJECT_NAME="redis_php$(echo '${{ matrix.php }}' | tr '.' '_')_l${{ matrix.laravel }}_r${{ matrix.redis }}"
          echo "project_name=${PROJECT_NAME}" >> $GITHUB_OUTPUT

      - name: Start Redis Sentinel Cluster
        env:
          REDIS_VERSION: ${{ matrix.redis }}
          REDIS_MAIN_PORT: ${{ steps.ports.outputs.redis_main }}
          REDIS_REPLICA1_PORT: ${{ steps.ports.outputs.redis_replica1 }}
          REDIS_REPLICA2_PORT: ${{ steps.ports.outputs.redis_replica2 }}
          REDIS_STANDALONE_PORT: ${{ steps.ports.outputs.redis_standalone }}
          REDIS_SENTINEL_PORT: ${{ steps.ports.outputs.sentinel }}
          COMPOSE_PROJECT_NAME: ${{ steps.ports.outputs.project_name }}
          SENTINEL_EXTRA_CONFIG: "echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf && echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&"
        run: |
          echo "Starting Redis cluster on ports: Main=$REDIS_MAIN_PORT, Replica1=$REDIS_REPLICA1_PORT, Replica2=$REDIS_REPLICA2_PORT, Standalone=$REDIS_STANDALONE_PORT, Sentinel=$REDIS_SENTINEL_PORT"
          SENTINEL_EXTRA_CONFIG="$SENTINEL_EXTRA_CONFIG" docker compose -f tests/ci/docker-compose.yml up -d

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}.*" "orchestra/testbench:${{ matrix.laravel == 10 && '^8.0' || (matrix.laravel == 11 && '^9.0' || (matrix.laravel == 12 && '^10.0' || '^11.0')) }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Wait for Redis Cluster to be ready
        run: |
          echo "Waiting for Redis cluster on sentinel port ${{ steps.ports.outputs.sentinel }}..."
          # Wait for sentinel to respond with PONG
          # Use docker run to avoid container naming issues with docker compose exec
          until docker run --network host --rm redis:${{ matrix.redis }}-alpine redis-cli -p ${{ steps.ports.outputs.sentinel }} -a test ping | grep -q PONG; do
            echo "Sentinel not ready yet..."
            sleep 2
          done
          echo "Redis Sentinel is ready!"

      - name: Execute tests
        run: vendor/bin/pest --coverage-clover coverage.xml --min=70 --testdox --log-junit junit.xml
        env:
          REDIS_PASSWORD: test
          REDIS_SENTINEL_PASSWORD: test
          REDIS_PREFIX: gh_${{ github.run_id }}_php${{ matrix.php }}_l${{ matrix.laravel }}_r${{ matrix.redis }}_
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ steps.ports.outputs.redis_main }}
          REDIS_STANDALONE_PORT: ${{ steps.ports.outputs.redis_standalone }}
          REDIS_SENTINEL_PORT: ${{ steps.ports.outputs.sentinel }}
          REDIS_SENTINEL_HOST: 127.0.0.1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          flags: php-${{ matrix.php }},laravel-${{ matrix.laravel }},redis-${{ matrix.redis }}
          fail_ci_if_error: false

      - name: Cleanup Redis Cluster
        if: always()
        env:
          COMPOSE_PROJECT_NAME: ${{ steps.ports.outputs.project_name }}
        run: |
          docker compose -f tests/ci/docker-compose.yml down -v --remove-orphans || true

  tests-without-horizon:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    name: PHP 8.4 - L12 - without Horizon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline, ldap, msgpack, igbinary, redis, sodium
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-laravel-12-without-horizon-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-laravel-12-without-horizon-
            ${{ runner.os }}-php-8.4-

      - name: Install dependencies without Horizon
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:12.*" "orchestra/testbench:^10.0" --dev --no-interaction --no-update
          composer remove laravel/horizon --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Start Redis Sentinel Cluster
        env:
          REDIS_VERSION: 7
          REDIS_MAIN_PORT: 7600
          REDIS_REPLICA1_PORT: 7601
          REDIS_REPLICA2_PORT: 7602
          REDIS_STANDALONE_PORT: 7603
          REDIS_SENTINEL_PORT: 7604
          COMPOSE_PROJECT_NAME: redis_without_horizon
          SENTINEL_EXTRA_CONFIG: "echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf && echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&"
        run: |
          echo "Starting Redis cluster without Horizon on ports: Main=$REDIS_MAIN_PORT, Replica1=$REDIS_REPLICA1_PORT, Replica2=$REDIS_REPLICA2_PORT, Standalone=$REDIS_STANDALONE_PORT, Sentinel=$REDIS_SENTINEL_PORT"
          SENTINEL_EXTRA_CONFIG="$SENTINEL_EXTRA_CONFIG" docker compose -f tests/ci/docker-compose.yml up -d

      - name: Wait for Redis Cluster to be ready
        run: |
          echo "Waiting for Redis cluster on sentinel port 7604..."
          until docker run --network host --rm redis:7-alpine redis-cli -p 7604 -a test ping | grep -q PONG; do
            echo "Sentinel not ready yet..."
            sleep 2
          done
          echo "Redis Sentinel is ready!"

      - name: Execute tests without Horizon
        run: |
          php -r '
          $files = [];
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("tests", FilesystemIterator::SKIP_DOTS));

          foreach ($iterator as $file) {
              $path = str_replace(DIRECTORY_SEPARATOR, "/", $file->getPathname());

              if (! str_ends_with($path, "Test.php") || str_starts_with($path, "tests/Feature/Horizon/")) {
                  continue;
              }

              $files[] = $path;
          }

          sort($files);
          file_put_contents("without-horizon-tests.txt", implode(PHP_EOL, $files));
          '

          vendor/bin/pest $(cat without-horizon-tests.txt) --testdox --log-junit junit.xml
        env:
          REDIS_PASSWORD: test
          REDIS_SENTINEL_PASSWORD: test
          REDIS_PREFIX: gh_${{ github.run_id }}_without_horizon_
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 7600
          REDIS_STANDALONE_PORT: 7603
          REDIS_SENTINEL_PORT: 7604
          REDIS_SENTINEL_HOST: 127.0.0.1

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          flags: php-8.4,laravel-12,redis-7,without-horizon
          fail_ci_if_error: false

      - name: Cleanup Redis Cluster
        if: always()
        env:
          COMPOSE_PROJECT_NAME: redis_without_horizon
        run: |
          docker compose -f tests/ci/docker-compose.yml down -v --remove-orphans || true

  tests-valkey:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    name: PHP 8.4 - L12 - Valkey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline, ldap, msgpack, igbinary, redis, sodium
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-laravel-12-valkey-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-laravel-12-valkey-
            ${{ runner.os }}-php-8.4-

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:12.*" "orchestra/testbench:^10.0" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Start Valkey Sentinel Cluster
        env:
          VALKEY_VERSION: 8
          VALKEY_MAIN_PORT: 7700
          VALKEY_REPLICA1_PORT: 7701
          VALKEY_REPLICA2_PORT: 7702
          VALKEY_SENTINEL_PORT: 7703
          VALKEY_STANDALONE_PORT: 7704
          COMPOSE_PROJECT_NAME: redis_valkey
          SENTINEL_EXTRA_CONFIG: "echo 'sentinel resolve-hostnames yes' >> /tmp/sentinel.conf && echo 'sentinel announce-hostnames yes' >> /tmp/sentinel.conf &&"
        run: |
          echo "Starting Valkey cluster on ports: Main=$VALKEY_MAIN_PORT, Replica1=$VALKEY_REPLICA1_PORT, Replica2=$VALKEY_REPLICA2_PORT, Sentinel=$VALKEY_SENTINEL_PORT, Standalone=$VALKEY_STANDALONE_PORT"
          SENTINEL_EXTRA_CONFIG="$SENTINEL_EXTRA_CONFIG" docker compose -f tests/ci/docker-compose.yml up -d valkey-main valkey-replica1 valkey-replica2 valkey-sentinel valkey

      - name: Wait for Valkey Cluster to be ready
        run: |
          echo "Waiting for Valkey cluster on sentinel port 7703..."
          until docker run --network host --rm valkey/valkey:8-alpine valkey-cli -p 7703 -a test ping | grep -q PONG; do
            echo "Valkey Sentinel not ready yet..."
            sleep 2
          done
          echo "Valkey Sentinel is ready!"

      - name: Execute tests
        run: vendor/bin/pest --testdox
        env:
          REDIS_PASSWORD: test
          REDIS_SENTINEL_PASSWORD: test
          REDIS_PREFIX: gh_${{ github.run_id }}_valkey_
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 7700
          REDIS_STANDALONE_PORT: 7704
          REDIS_SENTINEL_PORT: 7703
          REDIS_SENTINEL_HOST: 127.0.0.1

      - name: Cleanup Valkey Cluster
        if: always()
        env:
          COMPOSE_PROJECT_NAME: redis_valkey
        run: |
          docker compose -f tests/ci/docker-compose.yml down -v --remove-orphans || true

  tests-chaos:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    name: Chaos - real failover via toxiproxy (PHP 8.4 - L12 - R7)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, readline, ldap, msgpack, igbinary, redis, sodium
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-laravel-12-chaos-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-laravel-12-
            ${{ runner.os }}-php-8.4-

      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:12.*" "orchestra/testbench:^10.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Start Redis cluster with toxiproxy
        env:
          REDIS_VERSION: 7
          REDIS_MAIN_PORT: 7650
          REDIS_REPLICA1_PORT: 7651
          REDIS_REPLICA2_PORT: 7652
          REDIS_STANDALONE_PORT: 7653
          REDIS_SENTINEL_PORT: 7654
          REDIS_MAIN_PROXY_PORT: 7655
          REDIS_REPLICA1_PROXY_PORT: 7656
          REDIS_REPLICA2_PROXY_PORT: 7657
          TOXIPROXY_API_PORT: 7658
          COMPOSE_PROJECT_NAME: redis_chaos
        run: |
          echo "Starting chaos stack on ports: nodes=7650-7652, sentinel=7654, proxies=7655-7657, api=7658"
          docker compose -f tests/ci/docker-compose.yml -f docker-compose.chaos.yml up -d

      - name: Wait for Sentinel and toxiproxy
        env:
          REDIS_VERSION: 7
        run: |
          until docker run --network host --rm redis:${REDIS_VERSION}-alpine redis-cli -p 7654 -a test ping | grep -q PONG; do
            echo "Sentinel not ready yet..."; sleep 2
          done
          until curl -sf http://127.0.0.1:7658/version > /dev/null; do
            echo "toxiproxy not ready yet..."; sleep 1
          done

      - name: Execute tests
        # Chaos-only: the full suite already runs in the matrix jobs
        run: vendor/bin/pest --group=toxiproxy --testdox
        env:
          REDIS_PASSWORD: test
          REDIS_SENTINEL_PASSWORD: test
          REDIS_PREFIX: gh_${{ github.run_id }}_chaos_
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 7650
          REDIS_STANDALONE_PORT: 7653
          REDIS_SENTINEL_PORT: 7654
          REDIS_SENTINEL_HOST: 127.0.0.1
          TOXIPROXY_API: 7658
          REDIS_MAIN_PORT: 7650
          REDIS_REPLICA1_PORT: 7651
          REDIS_REPLICA2_PORT: 7652
          REDIS_MAIN_PROXY_PORT: 7655
          REDIS_REPLICA1_PROXY_PORT: 7656
          REDIS_REPLICA2_PROXY_PORT: 7657

      - name: Cleanup chaos stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: redis_chaos
        run: docker compose -f tests/ci/docker-compose.yml -f docker-compose.chaos.yml down -v --remove-orphans || true
